spring:
  application:
    name: ${APPLICATION_NAME:statusmonitor}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  monitoring:
    check-interval: ${MONITORING_CHECK_INTERVAL:30000}
    connection-timeout: ${MONITORING_CONNECTION_TIMEOUT:5000}
    read-timeout: ${MONITORING_READ_TIMEOUT:30000}
    max-retries: ${MONITORING_MAX_RETRIES:2}
    retry-delay: ${MONITORING_RETRY_DELAY:1000}
    user-agent: ${MONITORING_USER_AGENT:StatusMonitor/1.0}