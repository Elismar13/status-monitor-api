spring:
  application:
    name: statusmonitor
  profiles:
    active: dev

  monitoring:
    check-interval: 30000  # 30 segundos
    connection-timeout: 5000  # 5 segundos
    read-timeout: 30000  # 30 segundos
    max-retries: 2
    retry-delay: 1000  # 1 segundo
    user-agent: StatusMonitor/1.0