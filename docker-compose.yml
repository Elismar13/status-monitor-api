services:
  db:
    image: docker.io/postgres:17.5
    container_name: status_monitor_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-thushima} -d ${DB_NAME:-status_monitor}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - status-monitor-network

networks:
  status-monitor-network:
    driver: bridge

volumes:
  postgres_data:
